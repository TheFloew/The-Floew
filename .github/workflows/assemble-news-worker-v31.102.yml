name: Assemble News Worker v31.102

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-news-worker-v31.102.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and validate full Worker
        shell: bash
        run: |
          cat             .worker-staging/news-worker-v31.102/payload-00.b64             .worker-staging/news-worker-v31.102/payload-01.b64             .worker-staging/news-worker-v31.102/payload-02.b64             .worker-staging/news-worker-v31.102/payload-03.b64             .worker-staging/news-worker-v31.102/payload-04a.b64             .worker-staging/news-worker-v31.102/payload-04b.b64             .worker-staging/news-worker-v31.102/payload-05.b64             .worker-staging/news-worker-v31.102/payload-06.b64             .worker-staging/news-worker-v31.102/payload-07.b64             .worker-staging/news-worker-v31.102/payload-08.b64             .worker-staging/news-worker-v31.102/payload-09.b64             > /tmp/news-worker.b64

          base64 --decode /tmp/news-worker.b64 > /tmp/news-worker.bz2
          bzip2 -dc /tmp/news-worker.bz2 > News-Worker-v31.102.js

          node --check News-Worker-v31.102.js
          grep -Fq 'const WORKER_VERSION = "31.102";' News-Worker-v31.102.js
          grep -Fq 'const NEWS_CACHE_SCHEMA = "20260928-1";' News-Worker-v31.102.js
          grep -Fq 'function extractSputnikArticleImageFromHtml' News-Worker-v31.102.js
          grep -Fq 'sourceName === "Sputnik Türkiye"' News-Worker-v31.102.js

      - name: Commit the full deployable Worker
        shell: bash
        run: |
          rm -rf .worker-staging/news-worker-v31.102

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add News-Worker-v31.102.js
          git add -A .worker-staging/news-worker-v31.102
          git commit -m "Add full News Worker v31.102 with clean Sputnik Türkiye images"
          git push
