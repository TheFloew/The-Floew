<!doctype html>
<meta charset="utf-8">
<title>BaitBuster diagnostic</title>
<pre id="out">running…</pre>
<script>
(async()=>{
  const out=document.getElementById("out");
  try{
    const story={
      key:"diag-20261003-1",
      url:"https://example.com/haber",
      title:"Beklenen açıklama geldi",
      description:"Merkez Bankası politika faizini yüzde 40'a düşürdüğünü açıkladı.",
      source:"Tanılama",
      category:"Gündem"
    };
    const started=performance.now();
    const r=await fetch("https://thefloew-baitbuster.thefloewback.workers.dev/v1/evaluate",{
      method:"POST",
      mode:"cors",
      credentials:"omit",
      cache:"no-store",
      headers:{
        "Content-Type":"application/json",
        "X-BaitBuster-Client":"diagnostic",
        "X-BaitBuster-Version":"18"
      },
      body:JSON.stringify({stories:[story]})
    });
    const text=await r.text();
    out.textContent=JSON.stringify({
      ok:r.ok,
      status:r.status,
      elapsedMs:Math.round(performance.now()-started),
      body:text
    },null,2);
  }catch(error){
    out.textContent=JSON.stringify({
      error:String(error?.message||error),
      name:String(error?.name||"")
    },null,2);
  }
})();
</script>
