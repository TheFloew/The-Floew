name = "floew-ad-center"
main = "src/index.js"
compatibility_date = "2026-11-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "floew-ad-center"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "floew-ad-media"

[observability]
enabled = true
