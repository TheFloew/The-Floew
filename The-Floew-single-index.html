<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The Floew News Wall</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff}
body{font-family:Arial,Helvetica,sans-serif;user-select:none;touch-action:none}
#wall{position:fixed;inset:0;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;overflow:hidden;background:#000;transform:translateY(100%);will-change:transform}
.slide.active{transform:translateY(0)}
.slide-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;pointer-events:none;user-select:none;-webkit-user-drag:none}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.08) 55%,rgba(0,0,0,.84) 100%);pointer-events:none}
.headline{position:absolute;right:clamp(28px,5vw,90px);bottom:clamp(30px,6vh,80px);width:min(720px,48vw);text-align:right;text-shadow:0 2px 8px rgba(0,0,0,.95),0 4px 24px rgba(0,0,0,.75);pointer-events:none}
.source{margin-bottom:12px;font-size:13px;line-height:1;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.headline h1{margin:0;font-size:clamp(30px,3.3vw,62px);line-height:1.04;font-weight:700;letter-spacing:-.025em}
.time{margin-top:15px;font-size:13px;line-height:1;opacity:.75}
#logo{position:fixed;z-index:100;top:2.2vh;left:2.2vw;width:min(4vw,90px);height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.95)) drop-shadow(0 5px 12px rgba(0,0,0,.8))}
.enter-up{animation:enterUp .7s cubic-bezier(.22,.61,.36,1) forwards}
.exit-up{animation:exitUp .7s cubic-bezier(.22,.61,.36,1) forwards}
.enter-down{animation:enterDown .7s cubic-bezier(.22,.61,.36,1) forwards}
.exit-down{animation:exitDown .7s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes enterUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes exitUp{from{transform:translateY(0)}to{transform:translateY(-100%)}}
@keyframes enterDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes exitDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
#status{position:fixed;z-index:200;inset:0;display:grid;place-items:center;padding:40px;background:#000;color:#fff;text-align:center;font-size:18px;line-height:1.5}
#status[hidden]{display:none}
@media(max-width:900px){.headline{left:28px;right:28px;width:auto}.headline h1{font-size:clamp(28px,6vw,48px)}#logo{width:min(4vw,70px)}}
</style>
</head>

<img class="slide-image" alt="" draggable="false">
<div class="shade"></div>
<div class="headline"><div class="source"></div><h1></h1><div class="time"></div></div>
</article>

<article class="slide" id="b">
<img class="slide-image" alt="" draggable="false">
<div class="shade"></div>
<div class="headline"><div class="source"></div><h1></h1><div class="time"></div></div>
</article>
</main>
<div id="status" hidden></div>

<script>
const API="https://thefloew.thefloewback.workers.dev/news";
const SHOW_MS=10000, REFRESH_MS=120000, SWIPE=70;
const slides=[document.getElementById("a"),document.getElementById("b")];
const state={stories:[],index:0,active:0,busy:false,timer:null,x:0,y:0,t:0};

function status(msg){const e=document.getElementById("status");e.textContent=msg;e.hidden=false}
function clearStatus(){document.getElementById("status").hidden=true}

function timeText(v){
  const d=new Date(v);
  if(!v||Number.isNaN(d.getTime()))return "";
  const m=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));
  if(m<1)return "az önce";
  if(m<60)return m+" dakika önce";
  const h=Math.floor(m/60);
  if(h<24)return h+" saat önce";
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function fill(el,s){
  el.querySelector(".slide-image").src=s.image;
  el.querySelector(".slide-image").alt=s.title||"";
  el.querySelector(".source").textContent=s.source||"";
  el.querySelector("h1").textContent=s.title||"";
  el.querySelector(".time").textContent=timeText(s.published);
}

function timer(){
  clearTimeout(state.timer);
  state.timer=setTimeout(()=>move(1),SHOW_MS);
}

function move(dir){
  if(state.busy||state.stories.length<2)return;
  state.busy=true;
  clearTimeout(state.timer);

  const next=(state.index+dir+state.stories.length)%state.stories.length;
  const cur=slides[state.active], nxt=slides[1-state.active];

  fill(nxt,state.stories[next]);
  cur.className="slide";
  nxt.className="slide";
  void nxt.offsetWidth;

  nxt.classList.add(dir>0?"enter-up":"enter-down");
  cur.classList.add(dir>0?"exit-up":"exit-down");

  nxt.addEventListener("animationend",function done(){
    nxt.className="slide active";
    cur.className="slide";
    state.active=1-state.active;
    state.index=next;
    state.busy=false;
    timer();
  },{once:true});
}

async function load(){
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();
    const list=Array.isArray(data)?data.filter(x=>x&&x.title&&x.image):[];
    if(!list.length)throw new Error("Görselli haber yok");

    if(!state.stories.length){
      state.stories=list;
      state.index=0;
      fill(slides[0],list[0]);
      slides[0].className="slide active";
      clearStatus();
      timer();
      return;
    }

    const link=state.stories[state.index]?.link;
    state.stories=list;
    if(link){
      const i=list.findIndex(x=>x.link===link);
      if(i>=0)state.index=i;
    }
    clearStatus();
  }catch(err){
    console.error("NEWS WALL:",err);
    if(!state.stories.length)status("Haberler alınamadı. Cloudflare Worker bağlantısını kontrol edin.");
  }
}

window.addEventListener("wheel",e=>{
  e.preventDefault();
  if(Math.abs(e.deltaY)>=5)move(e.deltaY>0?1:-1);
},{passive:false});

window.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();move(1)}
  else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();move(-1)}
});

window.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  state.x=e.clientX;state.y=e.clientY;state.t=performance.now();
});

window.addEventListener("pointerup",e=>{
  if(e.button!==0)return;
  const dx=e.clientX-state.x, dy=e.clientY-state.y;
  const dt=performance.now()-state.t;

  if(Math.abs(dy)>=SWIPE && Math.abs(dy)>=Math.abs(dx) && dt<=1000){
    move(dy<0?1:-1);
  }else if(dt<=1000 && Math.abs(dx)<10 && Math.abs(dy)<10){
    move(1);
  }
});

window.addEventListener("dragstart",e=>e.preventDefault());

load();
setInterval(load,REFRESH_MS);
</script>
</body>
</html>
