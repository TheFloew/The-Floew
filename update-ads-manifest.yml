name: Update ads manifest

on:
  push:
    paths:
      - "ads/**"
      - "!ads/manifest.json"
      - ".github/workflows/update-ads-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ads/manifest.json
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          ads_dir = Path("ads")
          ads_dir.mkdir(exist_ok=True)

          allowed = {
              ".jpg": "image",
              ".jpeg": "image",
              ".mp4": "video",
          }

          items = []

          for path in sorted(ads_dir.iterdir(), key=lambda p: p.name.lower()):
              if not path.is_file():
                  continue

              ext = path.suffix.lower()
              media_type = allowed.get(ext)

              if not media_type:
                  continue

              items.append({
                  "src": path.as_posix(),
                  "type": media_type,
              })

          manifest = {
              "version": 1,
              "ads": items,
          }

          (ads_dir / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"{len(items)} ad file(s) written to ads/manifest.json")
          PY

      - name: Commit manifest if changed
        shell: bash
        run: |
          if git diff --quiet -- ads/manifest.json; then
            echo "Manifest unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ads/manifest.json
          git commit -m "Update ads manifest"
          git push
