name: Deploy Flöw to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ads manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          ads_dir = Path("ads")
          ads_dir.mkdir(exist_ok=True)

          allowed = {
              ".jpg": "image",
              ".jpeg": "image",
              ".mp4": "video",
          }

          ads = []

          for path in sorted(ads_dir.iterdir(), key=lambda p: p.name.lower()):
              if not path.is_file():
                  continue

              media_type = allowed.get(path.suffix.lower())
              if not media_type:
                  continue

              ads.append({
                  "src": path.as_posix(),
                  "type": media_type,
              })

          manifest = {
              "version": 1,
              "ads": ads,
          }

          (ads_dir / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Generated ads/manifest.json with {len(ads)} ad(s).")
          for item in ads:
              print(" -", item["type"], item["src"])
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
